<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--surface-2:#f0f2f7;--text:#111827;--muted:#6b7280;--border:#e3e6ee;
  --primary:#1d4ed8;--primary-ink:#fff;--primary-soft:#e7edfd;--accent:#ea580c;
  --ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;
  --info:#1d4ed8;--info-soft:#dbeafe;--radius:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06);
  --chart-bar:#3b6ef0;--chart-grid:#e5e7eb;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1020;--surface:#121a2d;--surface-2:#1a2338;--text:#e6e9f0;--muted:#98a2b6;--border:#26324a;
  --primary:#5b84ff;--primary-ink:#0b1020;--primary-soft:#1b2750;--accent:#fb923c;
  --ok:#4ade80;--ok-soft:#12301f;--warn:#fbbf24;--warn-soft:#33270d;--bad:#f87171;--bad-soft:#3a1616;
  --info:#7aa2ff;--info-soft:#18254a;--shadow:0 1px 2px rgba(0,0,0,.4);
  --chart-bar:#6d93ff;--chart-grid:#2a3550;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}.small{font-size:.875rem}.right{text-align:right}.nowrap{white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.topbar{background:var(--surface-2);border-bottom:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:32px;overflow:hidden}
.topbar a{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.topbar a:hover{color:var(--primary)}
.topbar svg{width:14px;height:14px;flex:none}
.topbar .tb-addr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:720px){.topbar{display:none}}
.hdr-in{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-weight:700;font-size:1.2rem;color:var(--primary);white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:0}
.logo svg,.logo img{width:30px;height:30px;flex:none;border-radius:8px;object-fit:contain}
#storeName{overflow:hidden;text-overflow:ellipsis}
.icon-btn.call{color:var(--primary)}
.icon-btn.wa{color:#15803d}
@media (prefers-color-scheme:dark){.icon-btn.wa{color:#4ade80}}
.menu-btn{margin-left:-8px}
@media (max-width:720px){.hdr-in{gap:6px}.icon-btn{padding:8px 7px}.logo{font-size:1.05rem}.hide-m{display:none!important}}
@media (max-width:400px){.hdr .icon-btn{padding:8px 5px}.hdr .logo{font-size:.95rem;gap:6px}.hdr-in{gap:4px}}
@media (max-width:340px){.hdr #storeName{display:none}}
/* announcement */
.ann{display:block;text-align:center;font-size:.9rem;font-weight:500;padding:7px 16px;line-height:1.4}
.ann-info{background:var(--primary);color:var(--primary-ink)}
.ann-ok{background:#15803d;color:#fff}
.ann-warn{background:#fde68a;color:#78350f}
.ann-accent{background:var(--accent);color:#fff}
a.ann:hover{text-decoration:underline}
/* side menu */
.drawer.drawer-l{right:auto;left:0;transform:translateX(-100%)}
.drawer.drawer-l.on{transform:none}
.drawer{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.mnav{display:flex;flex-direction:column;gap:2px}
.mnav a,.mnav button{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.mnav a:hover,.mnav button:hover{background:var(--surface-2)}
.mnav-h{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 8px 4px}
.contact-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.btn-wa{background:#15803d;border-color:#15803d;color:#fff}
.btn.btn-wa:hover{background:#166534}
.btn svg{width:18px;height:18px;flex:none}
/* floating WhatsApp */
.fab-wa{position:fixed;z-index:40;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:#15803d;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s}
.fab-wa:hover{transform:scale(1.06)}
.fab-wa svg{width:28px;height:28px}
.fab-wa.right{right:calc(18px + env(safe-area-inset-right))}.fab-wa.left{left:calc(18px + env(safe-area-inset-left))}
body.has-fab main{padding-bottom:90px}
.search{flex:1;display:flex;max-width:520px}
.search input{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface-2);border-radius:10px 0 0 10px;padding:9px 12px;outline:none}
.search input:focus{border-color:var(--primary)}
.search button{border:0;background:var(--primary);color:var(--primary-ink);border-radius:0 10px 10px 0;padding:0 14px;cursor:pointer}
.hdr-actions{display:flex;gap:4px;margin-left:auto}
.icon-btn{position:relative;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.count{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px}
.search-m{display:none;padding:0 0 10px}
@media (max-width:720px){.hdr .search{display:none}.search-m{display:flex}.search-m .search{display:flex;max-width:none}.lbl{display:none}}

main{flex:1;padding:20px 0 40px}
/* footer */
.ftr{border-top:1px solid var(--border);background:var(--surface);font-size:.92rem;color:var(--muted);padding-bottom:env(safe-area-inset-bottom)}
.ftr-grid{display:grid;gap:28px;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:36px 0 24px}
@media (max-width:960px){.ftr-grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.ftr-grid{grid-template-columns:1fr;gap:0;padding:24px 0 8px}}
.ftr h3,.ftr summary{color:var(--text);font-size:1rem;font-weight:600;margin:0 0 10px}
.ftr details summary{list-style:none;cursor:pointer}
.ftr details summary::-webkit-details-marker{display:none}
@media (min-width:601px){.ftr details summary{pointer-events:none}}
@media (max-width:600px){
  .ftr .fcol{border-bottom:1px solid var(--border);padding:12px 0}
  .ftr details summary{display:flex;justify-content:space-between;margin:0}
  .ftr details summary::after{content:"+";font-size:1.2rem;line-height:1}
  .ftr details[open] summary::after{content:"−"}
  .ftr details[open] summary{margin-bottom:10px}
  .ftr .fbrand{padding-bottom:16px;border-bottom:1px solid var(--border)}
}
.ftr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ftr a:hover{color:var(--primary)}
.ftr .fbrand .logo{margin-bottom:10px}
.ftr .ci{display:flex;gap:8px;align-items:flex-start}
.ftr .ci svg{width:17px;height:17px;flex:none;margin-top:3px}
.socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.soc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--text);background:var(--surface)}
.soc svg{width:16px;height:16px}
.soc:hover{border-color:var(--primary)}
.paychips{display:flex;gap:6px;flex-wrap:wrap}
.paychip{border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:.82rem;font-weight:600;color:var(--text);background:var(--surface-2)}
.ftr-bottom{border-top:1px solid var(--border);padding:14px 0;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-size:.85rem}

/* home: hero slider */
.slider{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2);margin-bottom:22px;outline:none}
.slider:focus-visible{box-shadow:0 0 0 3px var(--primary)}
.slides{display:flex;transition:transform .5s ease;touch-action:pan-y}
.slider.fade .slides{display:grid;transition:none}
.slider.fade .slide{grid-area:1/1;transition:opacity .6s ease;opacity:0}
@media (prefers-reduced-motion:reduce){.slides,.slider.fade .slide{transition:none}}
.slide-link{position:absolute;inset:0;z-index:1}
.slide-link:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.deal-img{border-radius:12px;overflow:hidden;aspect-ratio:12/4;background:var(--surface-2);margin-bottom:14px;position:relative}
.deal-img img{width:100%;height:100%;object-fit:cover}
.slider.fade .slide.on{opacity:1}
.slide{flex:0 0 100%;position:relative;aspect-ratio:12/5;container-type:inline-size;overflow:hidden;background:linear-gradient(120deg,var(--primary),#4338ca)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:6% 7%;color:#fff;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 60%,transparent)}
.slide-in h2{font-size:clamp(1.2rem,4cqw,2.4rem);margin:0;max-width:70%;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.slide-in p{margin:0;max-width:60%;font-size:clamp(.85rem,1.7cqw,1.1rem);opacity:.95}
.slide-in .kicker{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);align-self:flex-start;border-radius:6px;padding:2px 8px}
.slide-in .btn{align-self:flex-start;margin-top:6px}
.slide-in .desc-l{display:block}
@container (max-width:560px){
  .slide-in{padding:18px 18px 42px;background:linear-gradient(0deg,rgba(0,0,0,.65),rgba(0,0,0,.1) 75%)}
  .slide-in{justify-content:flex-end}
  .slide-in h2,.slide-in p{max-width:100%}
  .slide-in .desc-l{display:none}
}
@media (max-width:720px){.slide{aspect-ratio:4/3}}
.sl-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111827;cursor:pointer;font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.sl-prev{left:12px}.sl-next{right:12px}
@media (max-width:600px){.sl-nav{display:none}}
.sl-bar{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;align-items:center;gap:6px}
.sl-dot{width:9px;height:9px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.55);cursor:pointer;transition:width .2s}
.sl-dot.on{width:22px;background:#fff}
.sl-pause{border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;font-size:.75rem;padding:2px 9px;cursor:pointer;margin-left:6px}
/* promo banners */
.pbanners{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pbanner{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:linear-gradient(120deg,#4338ca,var(--primary));container-type:inline-size;display:block}
.pbanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbanner .slide-in{padding:14px 16px;gap:4px;justify-content:flex-end;background:linear-gradient(0deg,rgba(0,0,0,.65),rgba(0,0,0,.05) 80%)}
.pbanner .slide-in .desc-l{display:none}
.pbanner .btn{min-height:34px;padding:4px 14px}
.pbanner .slide-in h2{font-size:clamp(1rem,6cqw,1.4rem);max-width:100%}
.pbanner .slide-in p{max-width:100%}
/* campaign / deals */
.deal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-top:22px}
.deal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.deal-h h2{margin:0}
.deal-kind{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;margin-bottom:4px}
.deal-k-summer{background:#b45309}.deal-k-flash{background:#b91c1c}.deal-k-new_arrival{background:var(--primary)}.deal-k-weekend{background:#6d28d9}
.cd{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-weight:700}
.cd b{background:var(--text);color:var(--surface);border-radius:6px;padding:2px 7px;min-width:2.1em;text-align:center}
.cd-l{font-size:.85rem;color:var(--muted);margin-right:4px;font-weight:500}
.offer-tag{position:absolute;top:8px;right:8px;background:#b91c1c;color:#fff;font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 6px}
/* why us, contact */
.why{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.why .card{display:flex;gap:12px;align-items:flex-start;box-shadow:none}
.why svg{width:30px;height:30px;color:var(--primary);flex:none}
.cta{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;display:grid;gap:16px;grid-template-columns:1.2fr 1fr;align-items:center}
@media (max-width:800px){.cta{grid-template-columns:1fr}}
.cta-btns{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.legal-body{white-space:pre-line;line-height:1.75;max-width:820px}
/* admin CMS */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtabs a{border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-size:.9rem;background:var(--surface)}
.subtabs a.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.pv-tabs{display:flex;gap:6px;margin-bottom:10px}
.pv-stage{background:var(--surface-2);border:1px dashed var(--border);border-radius:12px;padding:12px;overflow:auto}
.pv-frame{margin:0 auto;transition:width .25s;max-width:100%}
.pv-frame.desktop{width:100%}.pv-frame.tablet{width:768px}.pv-frame.mobile{width:375px}
.pv-frame .slide{aspect-ratio:12/5}
.pv-frame.mobile .slide{aspect-ratio:4/3}
.pv-frame .slider{margin:0}
.sec-list{display:flex;flex-direction:column;gap:8px}
.sec-item{display:grid;grid-template-columns:auto 1fr 90px auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface)}
.sec-item .mv{display:flex;gap:2px}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.pick{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:6px 10px}
.pick .input{width:110px;padding:6px 8px}
.img-slot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-slot img{width:160px;aspect-ratio:12/5;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:var(--surface-2)}
.img-slot.m img{width:90px;aspect-ratio:4/3}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500;min-height:42px;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.08)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-sm{min-height:34px;padding:5px 12px;font-size:.9rem}
.btn-block{width:100%}
.link{background:none;border:0;color:var(--primary);cursor:pointer;padding:0}
label.f{display:block;font-size:.9rem;font-weight:500;margin-bottom:4px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.input{min-height:90px;resize:vertical}
.fgrid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.choice:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.choice input{margin-top:5px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}
.b-muted{background:var(--surface-2);color:var(--muted)}
.alert{border-radius:10px;padding:12px 14px;font-size:.95rem}
.alert-bad{background:var(--bad-soft);color:var(--bad)}.alert-warn{background:var(--warn-soft);color:var(--warn)}.alert-info{background:var(--info-soft);color:var(--info)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--muted)}

/* catalog */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.hero{background:linear-gradient(120deg,var(--primary),#4338ca);color:#fff;border-radius:16px;padding:28px 24px;margin-bottom:22px}
.hero h1{font-size:1.7rem;margin-bottom:6px}.hero p{margin:0;opacity:.9}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}

.pimg{position:relative;aspect-ratio:1;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.pimg img{width:100%;height:100%;object-fit:contain;padding:8px}
.ph{color:var(--muted);opacity:.5}.ph svg{width:48px;height:48px}
.off{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:.75rem;font-weight:700;border-radius:6px;padding:2px 6px}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pname{font-weight:500;font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.price{font-weight:700;color:var(--accent);font-size:1.05rem}
.price s{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:4px}
.oos{font-size:.8rem;color:var(--bad);font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filters .input{width:auto;min-width:110px}
.cat-tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.cat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-weight:600;text-align:center}
.cat-tile:hover{border-color:var(--primary);color:var(--primary)}

/* product page */
.pd{display:grid;gap:24px;grid-template-columns:1fr 1fr}

.gal-main{aspect-ratio:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal-main img{width:100%;height:100%;object-fit:contain;padding:16px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{border:2px solid var(--border);border-radius:8px;background:var(--surface);padding:2px;width:64px;height:64px;flex:none;cursor:pointer}
.thumbs button.on{border-color:var(--primary)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.pd-price{font-size:1.6rem;font-weight:700;color:var(--accent)}
.qty{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:38px;cursor:pointer;font-size:1.1rem}
.qty input{width:48px;border:0;text-align:center;background:var(--surface)}
.desc{white-space:pre-line}
.specs{width:100%;border-collapse:collapse}
.specs td{border-bottom:1px solid var(--border);padding:8px 6px;vertical-align:top}
.specs td:first-child{color:var(--muted);width:40%}
.stars{color:#f59e0b;letter-spacing:1px}
.review{border-bottom:1px solid var(--border);padding:12px 0}
.star-input{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.star-input input{display:none}
.star-input label{font-size:1.8rem;color:var(--border);cursor:pointer}
.star-input input:checked~label,.star-input label:hover,.star-input label:hover~label{color:#f59e0b}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:60;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-b{flex:1;overflow-y:auto;padding:12px 16px}
.drawer-f{border-top:1px solid var(--border);padding:14px 16px}
.citem{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.citem img,.citem .ph{width:64px;height:64px;object-fit:contain;background:var(--surface-2);border-radius:8px;display:flex;align-items:center;justify-content:center}
.modal-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-wide{width:min(760px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-h h2{margin:0}
.x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted);font-weight:500}
.tab.on{border-bottom-color:var(--primary);color:var(--primary)}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:#111827;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:pre-line;animation:tin .2s}
.toast.bad{background:var(--bad)}.toast.ok{background:#15803d}

.co{display:grid;gap:20px;grid-template-columns:1fr 360px;align-items:start}

.sum-total{border-top:1px solid var(--border);margin-top:8px;padding-top:10px;font-weight:700;font-size:1.1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}.kv dt{color:var(--muted)}.kv dd{margin:0}

.chart text{fill:var(--muted);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:.82rem;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.low{color:var(--bad);font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{width:auto;flex:1;min-width:180px}
.pager{display:flex;justify-content:center;margin-top:16px}
.img-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.img-prev img{width:64px;height:64px;object-fit:contain;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}

/* order tracking timeline */
.co2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:32px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border)}
.tl li.done:not(:last-child)::before{background:var(--ok)}
.tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;background:var(--surface-2);color:var(--muted);border:2px solid var(--border)}
.tl li.done .tl-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl li.cur .tl-dot{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);box-shadow:0 0 0 4px var(--warn-soft)}
.tl li.bad .tl-dot{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tl-t{font-weight:600}.tl-body{padding-top:4px;min-width:0}
.tl-x li:not(.done){opacity:.45}
.live{color:var(--ok);font-weight:600}
@keyframes blink{50%{opacity:.35}}.live{animation:blink 2s infinite}
.pay-box{border:1px dashed var(--primary);border-radius:10px;padding:12px;background:var(--primary-soft)}
.addr-pick{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.addr-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.addr-card{border:1px solid var(--border);border-radius:10px;padding:12px}
.addr-card.def{border-color:var(--primary);background:var(--primary-soft)}

.photo-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.photo{position:relative;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.photo img{width:100%;aspect-ratio:1;object-fit:contain}
.photo .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:.75rem;background:var(--surface)}

.photo button{border:0;background:none;cursor:pointer;font-size:1rem;padding:2px 4px;color:var(--text)}
code.id{font-size:.82rem;background:var(--surface-2);padding:1px 6px;border-radius:6px;word-break:break-all}

// One in-flight call per key: blocks double clicks / double submits.
const inFlight = new Set();
async function once(key, fn) {
  if (inFlight.has(key)) throw new AppError('IN_PROGRESS', 'অনুরোধটি প্রক্রিয়াধীন, অপেক্ষা করুন।');
  inFlight.add(key);
  try { return await fn(); } finally { inFlight.delete(key); }
}

const pad9 = (n) => String(Math.max(0, Math.floor(n))).padStart(9, '0');

/** Returns a { path: entry } fragment to merge into the same multi-path update as the action. */

async function registerCustomer({ name, email, password, phone }) {
  phone = normPhone(phone);

  if (!isBdPhone(phone)) throw new AppError('INVALID', 'সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (01XXXXXXXXX)।');
  if (!password || password.length < 8) throw new AppError('INVALID', 'Password কমপক্ষে ৮ অক্ষরের হতে হবে।');

  const cred = await createUserWithEmailAndPassword(auth, email.trim().toLowerCase(), password);
  const uid = cred.user.uid;
  try {
    // Profile + phone claim in one atomic write; the rules reject an already-claimed phone.
    await update(ref(db), {
      [`users/${uid}`]: {
        name: name.trim(), phone, email: email.trim().toLowerCase(),
        status: 'active', createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      },
      [`phoneIndex/${phone}`]: uid,
    });
  } catch (e) {
    await cred.user.delete().catch(() => {}); // don't leave an auth account without a profile
    if (isPermissionDenied(e)) throw new AppError('PHONE_TAKEN', 'এই মোবাইল নম্বর দিয়ে আগেই account খোলা হয়েছে।', e);
    throw e;
  }
  sendEmailVerification(cred.user).catch(() => {});
  return cred.user;
}

/**
 * Personal info. Empty string clears an optional field.
 * wallets: { bkash, nagad } — the customer's own sending numbers (never a PIN).
 */
async function updateMyProfile({ name, phone, gender, dob, wallets, preferredPayment }) {
  const user = requireUser();
  const current = await getMyProfile();
  if (!current) throw new AppError('NO_PROFILE', 'Profile পাওয়া যায়নি।');
  const base = `users/${user.uid}`;
  const updates = { [`${base}/updatedAt`]: serverTimestamp() };
  if (name !== undefined) {
    if (name.trim().length < 2) throw new AppError('INVALID', 'নাম কমপক্ষে ২ অক্ষরের হতে হবে।');
    updates[`${base}/name`] = name.trim().slice(0, 100);
  }
  if (gender !== undefined) {
    if (gender && !['male', 'female', 'other'].includes(gender)) throw new AppError('INVALID', 'লিঙ্গ সঠিক নয়।');
    updates[`${base}/gender`] = gender || null;
  }
  if (dob !== undefined) {
    if (dob && !/^(19|20)\d\d-[01]\d-[0-3]\d$/.test(dob)) throw new AppError('INVALID', 'জন্মতারিখ সঠিক নয়।');
    updates[`${base}/dob`] = dob || null;
  }
  if (wallets !== undefined) {
    for (const k of ['bkash', 'nagad']) {
      if (wallets[k] === undefined) continue;
      const n = normPhone(wallets[k]);
      if (n && !isBdPhone(n)) throw new AppError('INVALID', `${k === 'bkash' ? 'বিকাশ' : 'নগদ'} নম্বর সঠিক নয়।`);
      updates[`${base}/wallets/${k}`] = n || null;
    }
  }
  if (preferredPayment !== undefined) {
    if (preferredPayment && !['cod', 'bkash', 'nagad'].includes(preferredPayment)) throw new AppError('INVALID', 'পেমেন্ট পদ্ধতি সঠিক নয়।');
    updates[`${base}/preferredPayment`] = preferredPayment || null;
  }
  if (phone) {
    phone = normPhone(phone);
    if (!isBdPhone(phone)) throw new AppError('INVALID', 'সঠিক মোবাইল নম্বর দিন।');
    if (phone !== current.phone) {
      updates[`users/${user.uid}/phone`] = phone;
      updates[`phoneIndex/${phone}`] = user.uid;
      updates[`phoneIndex/${current.phone}`] = null; // release the old number
    }
  }
  try { await update(ref(db), updates); } catch (e) {
    if (phone && isPermissionDenied(e)) throw new AppError('PHONE_TAKEN', 'এই মোবাইল নম্বর অন্য account-এ ব্যবহৃত হচ্ছে।', e);
    throw e;
  }
}

/** slot = null → first free slot. Making one default clears the others in the same write. */
async function saveAddress(slot, a) {
  const uid = requireUser().uid;
  const existing = (await get(ref(db, `addresses/${uid}`))).val() || {};
  if (!slot) {
    slot = ADDR_SLOTS.find((k) => !existing[k]);
    if (!slot) throw new AppError('MAX_ADDR', 'সর্বোচ্চ ৫টি ঠিকানা রাখা যায়। একটি মুছে নতুনটি যোগ করুন।');
  }
  if (!ADDR_SLOTS.includes(slot)) throw new AppError('INVALID', 'ঠিকানা পাওয়া যায়নি।');
  const phone = normPhone(a.phone);
  if (!isBdPhone(phone)) throw new AppError('INVALID', 'সঠিক মোবাইল নম্বর দিন।');
  if (!a.name || a.name.trim().length < 2) throw new AppError('INVALID', 'প্রাপকের নাম দিন।');
  if (!a.address || a.address.trim().length < 5) throw new AppError('INVALID', 'পূর্ণ ঠিকানা দিন।');
  if (!a.district) throw new AppError('INVALID', 'জেলা নির্বাচন করুন।');
  if (!['inside_dhaka', 'outside_dhaka'].includes(a.zone)) throw new AppError('INVALID', 'এলাকা নির্বাচন করুন।');
  const isDefault = !!a.isDefault || Object.keys(existing).filter((k) => k !== slot).length === 0;
  const updates = {
    [`addresses/${uid}/${slot}`]: {
      label: String(a.label || 'ঠিকানা').trim().slice(0, 30) || 'ঠিকানা', name: a.name.trim().slice(0, 100), phone,
      address: a.address.trim().slice(0, 300), district: a.district.trim().slice(0, 50), zone: a.zone, isDefault,
    },
  };
  if (isDefault) for (const k of Object.keys(existing)) if (k !== slot && existing[k].isDefault) updates[`addresses/${uid}/${k}/isDefault`] = false;
  await update(ref(db), updates);
  return slot;
}

/**
 * Active products in a category, optional price range, sorted by price, cursor-paginated.
 * One indexed query on `catPrice` — inactive products are never downloaded.
 * Returns { items, cursor }; pass cursor back for the next page (null = no more).
 */
async function listProductsByCategory(category, { minPrice = 0, maxPrice = 99_999_999, sort = 'price_asc', pageSize = 24, cursor = null } = {}) {
  pageSize = Math.min(pageSize, PAGE_MAX.products);
  const lo = catPriceKey(category, minPrice), hi = catPriceKey(category, maxPrice);
  const base = ref(db, 'products');
  const q = sort === 'price_desc'
    ? query(base, orderByChild('catPrice'), startAt(lo), cursor ? endBefore(cursor.value, cursor.key) : endAt(hi), limitToLast(pageSize))
    : query(base, orderByChild('catPrice'), cursor ? startAfter(cursor.value, cursor.key) : startAt(lo), endAt(hi), limitToFirst(pageSize));
  let items = list(await get(q));
  if (sort === 'price_desc') items.reverse();
  const last = items.at(-1);
  return { items, cursor: items.length === pageSize && last ? { value: last.catPrice, key: last.id } : null };
}

/** Prefix search on product name ("sams" → "Samsung Galaxy…"). For typo-tolerant search use Algolia/Typesense later. */
async function searchProducts(text, count = 20, { includeInactive = false } = {}) {

  const q = query(ref(db, 'products'), orderByChild('nameLower'), startAt(term), endAt(term + '\uf8ff'), limitToFirst(Math.min(count, PAGE_MAX.products)));
  const items = list(await get(q));
  return includeInactive ? items : items.filter((p) => p.status === 'active');
}

/**
 * Only links an admin may put on the site: in-site routes (#/...), https/http, tel: and whatsapp://send.
 * Everything else (javascript:, data:, vbscript:, file:, relative paths, quotes, spaces) → ''.
 */
function safeLink(u) {
  const s = String(u || '').trim();
  if (!s || s.length > 500 || /[\s"'<>`\\]/.test(s)) return '';
  if (/^#\/[A-Za-z0-9\-._~/?=&%]*$/.test(s)) return s;
  if (/^tel:\+?[0-9]{6,15}$/.test(s)) return s;
  if (/^whatsapp:\/\/send\?[A-Za-z0-9=&%+._-]*$/.test(s)) return s;
  try {
    const x = new URL(s);
    if ((x.protocol === 'https:' || x.protocol === 'http:') && /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(x.hostname) && !x.username && !x.password) return x.href;
  } catch { /* not a URL */ }
  return '';
}

function safeSocialUrl(key, u) {
  const s = safeLink(u);
  if (!/^https:\/\//.test(s)) return '';
  const host = new URL(s).hostname.toLowerCase();
  return (SOCIAL_HOSTS[key] || []).some((h) => host === h || host.endsWith('.' + h)) ? s : '';

/** "Field: old → new" lines for the audit log. Long values are cut; image data is never logged. */
function diffSummary(oldObj, newObj, prefix = '') {
  const out = [];
  const short = (v) => {
    if (v === undefined || v === null || v === '') return '∅';
    if (typeof v === 'string' && v.startsWith('data:')) return `[image ${Math.round(v.length / 1365)}KB]`;
    const t = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return t.length > 60 ? t.slice(0, 57) + '…' : t;
  };
  const keys = new Set([...Object.keys(oldObj || {}), ...Object.keys(newObj || {})]);
  for (const k of keys) {
    if (k === 'updatedAt' || k === 'createdAt') continue;
    const a = oldObj?.[k], b = newObj?.[k];
    const plainObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
    if (plainObj(a) || plainObj(b)) {
      if (k === 'products') { const n = (v) => Object.keys(v || {}).length; if (n(a) !== n(b) || JSON.stringify(a) !== JSON.stringify(b)) out.push(`${prefix}products: ${n(a)} → ${n(b)}`); continue; }
      out.push(...diffSummary(a, b, `${prefix}${k}.`)); continue;
    }
    if (typeof b === 'object' && b && '.sv' in b) continue; // serverTimestamp placeholder
    if ((a ?? '') !== (b ?? '')) out.push(`${prefix}${k}: ${short(a)} → ${short(b)}`);
  }
  return out;
}
const diffText = (a, b) => diffSummary(a, b).join(' | ').slice(0, 1800) || 'no change';

/** Live/scheduled/expired/off is derived from time, never stored (nothing would update it on Spark). */
function cmsStatus(item, now = serverNow()) {
  if (!item?.enabled) return 'inactive';
  if ((item.endAt ?? FAR_FUTURE) <= now) return 'expired';
  if ((item.startAt ?? 0) > now) return 'scheduled';
  return 'active';
}
const isLive = (item, now) => cmsStatus(item, now) === 'active';

// ============================================================ promo pricing (same logic everywhere)
/**
 * Price after campaign discount, or null when the campaign doesn't lower this product's price.
 * percentage: value 1–90 · fixed: taka off · specialPrice: per-product price stored in campaign.products[pid].
 */
function campaignPrice(c, basePrice, entry) {
  let price;
  if (c.discountType === 'percentage') price = basePrice - Math.floor((basePrice * c.discountValue) / 100);
  else if (c.discountType === 'fixed') price = basePrice - c.discountValue;
  else price = typeof entry === 'number' ? entry : NaN;
  price = Math.round(price);
  return Number.isFinite(price) && price >= 1 && price < basePrice ? price : null;
}

/**
 * The promo that applies to a product right now (server time), or null.
 * Business rule: highest campaign priority wins; equal priority → lower price wins.
 * The database rule accepts only an order line whose price is the product price or one of the
 * product's admin-written promos that is live at the server's `now` — so the browser can't invent a discount.
 */
function activePromo(p, now = serverNow()) {
  let best = null;
  for (const [id, pr] of Object.entries(p?.promos || {})) {
    if (!pr || typeof pr.price !== 'number' || !(pr.price >= 1) || !(pr.price < p.price)) continue;
    if (!(pr.startAt <= now && pr.endAt > now)) continue;
    const prio = pr.priority || 0;
    if (!best || prio > best.priority || (prio === best.priority && pr.price < best.price)) best = { id, ...pr, priority: prio };
  }
  return best;
}
const effectivePrice = (p, now) => activePromo(p, now)?.price ?? p.price;
/** Free delivery when settings.freeShippingMin is set and the subtotal reaches it (the order rule checks the same). */
const shippingFor = (rate, subtotal, freeMin) => (typeof freeMin === 'number' && freeMin > 0 && subtotal >= freeMin ? 0 : rate);

const PUB_CACHE_KEY = 'tp_pub_v1';

function readPubCache() {

}
function writePubCache(patch) {
  try { localStorage.setItem(PUB_CACHE_KEY, JSON.stringify({ ...(readPubCache() || {}), ...patch })); } catch { /* quota/private mode */ }
}
const cachedSettings = () => readPubCache()?.settings || null;
const rememberSettings = (settings) => writePubCache({ settings });

/** { homepage, banners, campaigns } — each part fails soft so the shop keeps working (offline, rules not yet published). */
async function loadPublicContent(settings, { force = false } = {}) {
  const cache = readPubCache();
  const version = Number(settings?.version) || 0;
  if (!force && cache?.content && cache.version === version && Date.now() - (cache.at || 0) < PUB_CACHE_TTL) return cache.content;
  let failed = false;
  const soft = (p, fb) => p.catch((e) => { failed = true; console.warn('[cms]', e?.message || e); return fb; });
  const [homepage, banners, campaigns] = await Promise.all([
    soft(get(ref(db, 'homepage')).then((s) => s.val() || {}), {}),
    soft(fetchLiveBanners(), []),
    soft(fetchLiveCampaigns(), []),
  ]);
  const content = { homepage, banners, campaigns };
  if (!failed) writePubCache({ version, at: Date.now(), content });
  return content;
}

// Banner/campaign images: fetched only when about to be shown, one variant per device,
// cached in localStorage (≤2.5MB, oldest evicted). Cache key includes updatedAt, so a replaced image is refetched.
const IMG_CACHE_MAX = 2_500_000;
const imgInflight = new Map();
const isSafeDataImage = (v) => typeof v === 'string' && /^data:image\/(webp|jpeg);base64,[A-Za-z0-9+/=]+$/.test(v);
function imgCacheGet(k) { try { return localStorage.getItem('tp_img:' + k); } catch { return null; } }
function imgCachePut(k, v) {
  if (v.length > IMG_CACHE_MAX / 2) return;
  try {
    const idx = JSON.parse(localStorage.getItem('tp_img_idx') || '[]').filter((e) => e && e.k !== k);
    idx.push({ k, n: v.length });
    let total = idx.reduce((a, e) => a + e.n, 0);
    while (total > IMG_CACHE_MAX && idx.length > 1) { const old = idx.shift(); total -= old.n; localStorage.removeItem('tp_img:' + old.k); }
    localStorage.setItem('tp_img:' + k, v);
    localStorage.setItem('tp_img_idx', JSON.stringify(idx));
  } catch { /* storage full: serve without caching */ }
}
/** path: 'bannerImages/{id}/desktop' | 'bannerImages/{id}/mobile' | 'campaignImages/{id}'. stamp = record.updatedAt. */
function getCmsImage(path, stamp) {
  const key = `${path}:${stamp || 0}`;
  const hit = imgCacheGet(key);
  if (isSafeDataImage(hit)) return Promise.resolve(hit);
  if (imgInflight.has(key)) return imgInflight.get(key);
  const p = get(ref(db, path)).then((s) => {
    const v = s.val();
    if (!isSafeDataImage(v)) return '';
    imgCachePut(key, v);
    return v;
  }).catch((e) => { console.warn('[cms image]', path, e?.message || e); return ''; }).finally(() => imgInflight.delete(key));
  imgInflight.set(key, p);
  return p;
}

  id = id || push(child(ref(db), 'banners')).key;

  const media = { ...(old?.media || {}), ...(meta.media || {}) };
  if (images.mobile === null) delete media.mobile;
  const record = {
    ...meta, media: Object.keys(media).length ? media : null,
    hasMobile: images.mobile === undefined ? !!old?.hasMobile : !!images.mobile,
    createdAt: old?.createdAt ?? serverTimestamp(), updatedAt: serverTimestamp(),
  };
  const updates = { [p]: record, ...bump() };
  if (images.desktop !== undefined) updates[`bannerImages/${id}/desktop`] = images.desktop;
  if (images.mobile !== undefined) updates[`bannerImages/${id}/mobile`] = images.mobile;
  Object.assign(updates, auditEntry(isNew ? 'banner.create' : 'banner.update', p,
    diffText(old, record) + (images.desktop ? ' | desktop image replaced' : '') + (images.mobile !== undefined ? ` | mobile image ${images.mobile ? 'replaced' : 'removed'}` : '')));
  await update(ref(db), updates);
  return id;
}

/**
 * Saves the campaign and, in the SAME atomic write, sets products/{pid}/promos/{campaignId}
 * on every product it covers (and clears it on products removed from it or when disabled).
 * Returns { id, applied, skipped:[names whose price wouldn't drop] }.
 */
async function saveCampaign(id, c, { image } = {}) {
  requireUser();
  const isNew = !id;
  id = id || push(child(ref(db), 'campaigns')).key;
  const p = `campaigns/${id}`;
  const old = isNew ? null : (await get(ref(db, p))).val();
  if (!isNew && !old) throw new AppError('NOT_FOUND', 'ক্যাম্পেইন পাওয়া যায়নি।');
  if (image && !isSafeDataImage(image)) throw new AppError('INVALID', 'ছবিটি সঠিক নয়।');
  const pids = Object.keys(c.products || {});
  if (!pids.length) throw new AppError('INVALID', 'অন্তত একটি পণ্য যোগ করুন।');
  if (pids.length > CAMPAIGN_MAX_PRODUCTS) throw new AppError('INVALID', `একটি ক্যাম্পেইনে সর্বোচ্চ ${CAMPAIGN_MAX_PRODUCTS}টি পণ্য রাখা যায়।`);
  const affected = [...new Set([...pids, ...Object.keys(old?.products || {})])];
  const snaps = await Promise.all(affected.map((pid) => get(ref(db, `products/${pid}`))));
  const products = {};
  const updates = {};
  const skipped = [];
  let applied = 0;
  snaps.forEach((s, i) => {
    const pid = affected[i], prod = s.val();
    if (!prod) return; // product deleted: drop it from the campaign
    const inCampaign = c.products[pid] !== undefined;
    if (inCampaign) products[pid] = c.products[pid];
    const price = inCampaign && c.enabled ? campaignPrice(c, prod.price, c.products[pid]) : null;
    if (inCampaign && c.enabled && price == null) skipped.push(prod.name);
    if (price != null) applied++;
    const promo = price != null ? { price, startAt: c.startAt, endAt: c.endAt, priority: c.priority } : null;
    if (promo || prod.promos?.[id]) updates[`products/${pid}/promos/${id}`] = promo;
  });
  if (!Object.keys(products).length) throw new AppError('INVALID', 'নির্বাচিত পণ্যগুলো আর পাওয়া যাচ্ছে না।');
  const hasImage = image === undefined ? !!old?.hasImage : !!image;
  const record = { ...c, products, hasImage, createdAt: old?.createdAt ?? serverTimestamp(), updatedAt: serverTimestamp() };
  updates[p] = record;
  if (image !== undefined) updates[`campaignImages/${id}`] = image;
  Object.assign(updates, bump(), auditEntry(isNew ? 'campaign.create' : 'campaign.update', p,
    `${diffText(old, record)} | promo on ${applied} products${skipped.length ? `, skipped ${skipped.length}` : ''}`));
  await update(ref(db), updates);
  return { id, applied, skipped };
}

async function deleteCampaign(id) {
  const old = (await get(ref(db, `campaigns/${id}`))).val();
  if (!old) return;
  const updates = { [`campaigns/${id}`]: null, [`campaignImages/${id}`]: null, ...bump() };
  const snaps = await Promise.all(Object.keys(old.products || {}).map((pid) => get(ref(db, `products/${pid}/promos/${id}`)).then((s) => [pid, s.exists()])));
  for (const [pid, has] of snaps) if (has) updates[`products/${pid}/promos/${id}`] = null;
  Object.assign(updates, auditEntry('campaign.delete', `campaigns/${id}`, `${old.title} · ${Object.keys(old.products || {}).length} products`));
  await update(ref(db), updates);
}

/** After a product's price changes: recompute its promo prices from their campaigns (CMS roles only). */
async function recomputeProductPromos(productId, newPrice, promos) {
  const out = {};
  for (const cid of Object.keys(promos || {})) {
    const c = (await get(ref(db, `campaigns/${cid}`))).val();
    const price = c && c.enabled ? campaignPrice(c, newPrice, c.products?.[productId]) : null;
    out[`products/${productId}/promos/${cid}`] = price != null ? { price, startAt: c.startAt, endAt: c.endAt, priority: c.priority } : null;
  }
  return out;
}

/**
 * Places an order. Prices are read from the database (never from the cart UI);
 * the rules re-check every item price, line total, shipping cost and total.
 * @param cart     [{ productId, qty }]
 * @param shipping { name, phone, address, district, zone: 'inside_dhaka'|'outside_dhaka', note? }
 * @param payment  { method: 'cod'|'bkash'|'nagad'|'rocket'|'bank', ref?: TrxID }
 */
function placeOrder({ cart, shipping, payment }) {
  const user = requireUser();
  return once(`order:${user.uid}`, async () => {
    if (!Array.isArray(cart) || !cart.length) throw new AppError('EMPTY_CART', 'কার্ট খালি।');
    if (!['cod', 'bkash', 'nagad', 'rocket', 'bank'].includes(payment?.method)) throw new AppError('INVALID', 'Payment পদ্ধতি নির্বাচন করুন।');
    if (payment.method !== 'cod' && !(payment.ref && payment.ref.trim().length >= 4)) {
      throw new AppError('INVALID', 'Transaction ID (TrxID) দিন।');
    }
    const from = payment.method !== 'cod' && payment.from ? normPhone(payment.from) : '';
    if (from && !isBdPhone(from)) throw new AppError('INVALID', 'যে নম্বর থেকে টাকা পাঠিয়েছেন সেটি সঠিক নয়।');
    const ship = { ...shipping, phone: normPhone(shipping?.phone) };
    if (!isBdPhone(ship.phone)) throw new AppError('INVALID', 'সঠিক মোবাইল নম্বর দিন।');
    if (!['inside_dhaka', 'outside_dhaka'].includes(ship.zone)) throw new AppError('INVALID', 'ডেলিভারি এলাকা নির্বাচন করুন।');
    if (!ship.name || ship.name.trim().length < 2) throw new AppError('INVALID', 'প্রাপকের নাম দিন।');
    if (!ship.address || ship.address.trim().length < 5) throw new AppError('INVALID', 'পূর্ণ ঠিকানা দিন।');
    if (!ship.district || ship.district.trim().length < 2) throw new AppError('INVALID', 'জেলা নির্বাচন করুন।');

    // Merge duplicate lines, then load live products + shipping rate in parallel.
    const qtyById = {};
    for (const { productId, qty } of cart) qtyById[productId] = (qtyById[productId] || 0) + Math.floor(qty);
    const ids = Object.keys(qtyById);
    const [snaps, rateSnap, metaSnap, freeSnap] = await Promise.all([
      Promise.all(ids.map((id) => get(ref(db, `products/${id}`)))),
      get(ref(db, `settings/shipping/${ship.zone}`)),
      get(ref(db, `userMeta/${user.uid}/lastOrderAt`)),
      get(ref(db, 'settings/freeShippingMin')),
    ]);

    // Friendly pre-check using server-corrected time; the rules enforce the real limit.
    const wait = (metaSnap.val() || 0) + ORDER_RATE_LIMIT_MS - serverNow();
    if (wait > 0 && wait <= ORDER_RATE_LIMIT_MS) throw new AppError('RATE_LIMIT', `${Math.ceil(wait / 1000)} সেকেন্ড পর আবার অর্ডার করুন।`);

    // Price = live campaign price when one applies (promoId lets the rules check it), else the product price.
    const now = serverNow();
    const items = {}; let subtotal = 0; const problems = [];
    snaps.forEach((s, i) => {
      const p = s.val(), id = ids[i], qty = qtyById[id];
      if (!p || p.status !== 'active') return problems.push(`"${p?.name || id}" এখন পাওয়া যাচ্ছে না`);
      if (qty < 1 || qty > 20) return problems.push(`"${p.name}" — পরিমাণ ১ থেকে ২০ এর মধ্যে হতে হবে`);
      if ((p.stock ?? 0) < qty) return problems.push(`"${p.name}" — স্টকে আছে ${p.stock ?? 0}টি`);
      const promo = activePromo(p, now);
      const price = promo ? promo.price : p.price;
      items[id] = { name: p.name, price, qty, lineTotal: price * qty, ...(promo ? { promoId: promo.id } : {}) };
      subtotal += price * qty;
    });
    if (problems.length) throw new AppError('CART_INVALID', problems.join('\n'));
    const rate = rateSnap.val();
    if (typeof rate !== 'number') throw new AppError('CONFIG', 'ডেলিভারি চার্জ সেট করা নেই। পরে চেষ্টা করুন।');
    const shippingCost = shippingFor(rate, subtotal, freeSnap.val());

    const orderId = push(child(ref(db), 'orders')).key;
    const order = {
      customerId: user.uid, items,
      shipping: {
        name: ship.name?.trim(), phone: ship.phone, address: ship.address?.trim(),
        district: ship.district?.trim(), zone: ship.zone, ...(ship.note ? { note: ship.note.trim().slice(0, 300) } : {}),
      },
      subtotal, shippingCost, total: subtotal + shippingCost,
      status: 'pending', paymentStatus: 'pending', paymentMethod: payment.method,
      ...(payment.method !== 'cod' ? { paymentRef: payment.ref.trim().slice(0, 40) } : {}),
      ...(from ? { paymentFrom: from } : {}),
      createdAt: serverTimestamp(),
    };
    const updates = {
      [`orders/${orderId}`]: order,
      [`userOrders/${user.uid}/${orderId}`]: serverTimestamp(),
      [`userMeta/${user.uid}/lastOrderAt`]: serverTimestamp(),
    };
    for (const id of ids) updates[`carts/${user.uid}/${id}`] = null; // clear ordered lines atomically

    try { await update(ref(db), updates); } catch (e) {
      if (isPermissionDenied(e)) {
        throw new AppError('ORDER_REJECTED', 'অর্ডারটি গ্রহণ করা যায়নি। দাম বা স্টক পরিবর্তন হয়ে থাকতে পারে — কার্ট রিফ্রেশ করে আবার চেষ্টা করুন।', e);
      }
      throw e;
    }
    return { orderId, total: order.total };
  });
}

/**
 * Live order tracking: cb(order|null) now and on every status change.
 * One listener on one small node; returns an unsubscribe function.

/** One review per customer per product, only after delivery. Retries if another review lands at the same moment. */
function submitReview(productId, { rating, comment = '', displayName }) {
  const user = requireUser();
  return once(`review:${productId}`, async () => {
    rating = Math.round(rating);
    if (!(rating >= 1 && rating <= 5)) throw new AppError('INVALID', '১ থেকে ৫ স্টার দিন।');
    const bought = await get(ref(db, `purchases/${user.uid}/${productId}`));
    if (!bought.exists()) throw new AppError('NOT_PURCHASED', 'পণ্যটি ডেলিভারি পাওয়ার পরই রিভিউ দেওয়া যাবে।');
    for (let attempt = 0; attempt < 4; attempt++) {
      const cur = (await get(ref(db, `ratings/${productId}`))).val() || { count: 0, sum: 0 };
      try {
        await update(ref(db), {
          [`reviews/${productId}/${user.uid}`]: {
            rating, name: String(displayName || 'Customer').slice(0, 60),
            comment: String(comment).slice(0, 1000), createdAt: serverTimestamp(),
          },
          [`ratings/${productId}`]: { count: cur.count + 1, sum: cur.sum + rating },
        });
        return;
      } catch (e) {
        if (!isPermissionDenied(e)) throw e;
        const mine = await get(ref(db, `reviews/${productId}/${user.uid}`)).catch(() => null);
        if (mine?.exists()) throw new AppError('ALREADY_REVIEWED', 'এই পণ্যে আপনি আগেই রিভিউ দিয়েছেন।', e);
        // otherwise the rating counter moved under us — retry with fresh numbers
      }
    }
    throw new AppError('BUSY', 'এই মুহূর্তে রিভিউ জমা দেওয়া যাচ্ছে না, আবার চেষ্টা করুন।');
  });
}

/** Rules can't sum items, so staff verify subtotal = Σ lineTotal before confirming. */
function verifyOrderTotals(order) {
  const issues = [];
  let sum = 0;
  for (const [id, it] of Object.entries(order.items || {})) {
    if (it.lineTotal !== it.price * it.qty) issues.push(`${id}: line total ভুল`);
    sum += it.lineTotal;
  }
  if (sum !== order.subtotal) issues.push(`Subtotal ${order.subtotal} কিন্তু পণ্যের যোগফল ${sum}`);
  if (order.total !== order.subtotal + order.shippingCost) issues.push('Total ভুল');
  return { ok: issues.length === 0, issues };
}

/**
 * Confirm a pending order: server-enforced lock → re-check → verify totals →
 * deduct stock (transaction per item, rolled back on failure) → one atomic write
 * of status + stats + audit.
 */
function confirmOrder(orderId) {
  const staff = requireUser();
  return once(`confirm:${orderId}`, async () => {
    const orderPath = `orders/${orderId}`;
    try {
      await update(ref(db), { [`${orderPath}/staffMeta/lock`]: { by: staff.uid, at: serverTimestamp() } });
    } catch (e) {
      if (isPermissionDenied(e)) throw new AppError('LOCKED', 'অন্য একজন staff এই অর্ডারটি নিয়ে কাজ করছেন।', e);
      throw e;
    }
    const releaseLock = () => update(ref(db), { [`${orderPath}/staffMeta/lock`]: null }).catch(() => {});

    const snap = await get(ref(db, orderPath));
    const order = snap.val();
    if (!order) { await releaseLock(); throw new AppError('NOT_FOUND', 'অর্ডার পাওয়া যায়নি।'); }
    if (order.status !== 'pending') { await releaseLock(); throw new AppError('STATE', `অর্ডারটি এখন "${order.status}" অবস্থায় আছে।`); }
    const check = verifyOrderTotals(order);
    if (!check.ok) { await releaseLock(); throw new AppError('TOTAL_MISMATCH', `হিসাবে গরমিল — অর্ডারটি বাতিল করুন:\n${check.issues.join('\n')}`); }

    const deducted = [];
    try {
      for (const [pid, it] of Object.entries(order.items)) {
        const res = await runTransaction(ref(db, `products/${pid}/stock`), (cur) => {
          if (cur === null) return cur; // cache cold: let the server supply the real value
          return cur >= it.qty ? cur - it.qty : undefined; // undefined = abort
        });
        if (!res.committed) throw new AppError('OUT_OF_STOCK', `"${it.name}" স্টকে পর্যাপ্ত নেই (আছে ${res.snapshot.val() ?? 0}টি)।`);
        deducted.push([pid, it.qty]);
      }
      const day = dhakaDay();
      await update(ref(db), {
        [`${orderPath}/status`]: 'confirmed',
        [`${orderPath}/staffMeta/confirmedBy`]: staff.uid,
        [`${orderPath}/staffMeta/confirmedAt`]: serverTimestamp(),
        [`${orderPath}/staffMeta/confirmedDay`]: day,
        [`${orderPath}/staffMeta/stockDeducted`]: true,
        [`${orderPath}/staffMeta/lock`]: null,
        [`stats/daily/${day}/confirmedOrders`]: increment(1),
        [`stats/daily/${day}/revenue`]: increment(order.total),
        [`stats/totals/confirmedOrders`]: increment(1),
        [`stats/totals/revenue`]: increment(order.total),
        ...auditEntry('order.confirm', orderPath, `total=${order.total}`),
      });
    } catch (e) {
      // Put back any stock already taken so inventory stays consistent.
      if (deducted.length) {
        await update(ref(db), Object.fromEntries(deducted.map(([pid, q]) => [`products/${pid}/stock`, increment(q)])))
          .catch((err) => console.error('[confirmOrder] stock rollback failed — fix manually:', deducted, err));
      }
      await releaseLock();
      throw e;
    }
  });
}

 * Delivered → also records purchases so the customer can review those products.

 */
async function markDelivered(orderId, { markPaid = false } = {}) {
  requireUser();
  const p = `orders/${orderId}`;
  const order = (await get(ref(db, p))).val();
  if (!order) throw new AppError('NOT_FOUND', 'অর্ডার পাওয়া যায়নি।');
  const updates = {

/** Staff cancel: restores stock and reverses that day's stats if the order had been confirmed. */
function cancelOrderAsStaff(orderId, reason = '') {
  const staff = requireUser();
  return once(`cancel:${orderId}`, async () => {
    const p = `orders/${orderId}`;
    const order = (await get(ref(db, p))).val();
    if (!order) throw new AppError('NOT_FOUND', 'অর্ডার পাওয়া যায়নি।');
    if (order.status === 'cancelled' || order.status === 'delivered') throw new AppError('STATE', `"${order.status}" অর্ডার বাতিল করা যায় না।`);
    const updates = {
      [`${p}/status`]: 'cancelled',
      [`${p}/staffMeta/cancelledBy`]: staff.uid,
      [`${p}/staffMeta/cancelledAt`]: serverTimestamp(),
      ...(reason ? { [`${p}/staffMeta/note`]: String(reason).slice(0, 500) } : {}),
      ...auditEntry('order.cancel', p, reason),
    };
    if (order.staffMeta?.stockDeducted) {
      for (const [pid, it] of Object.entries(order.items)) updates[`products/${pid}/stock`] = increment(it.qty);
      updates[`${p}/staffMeta/stockDeducted`] = false;
      const day = order.staffMeta.confirmedDay;
      if (day) {
        updates[`stats/daily/${day}/confirmedOrders`] = increment(-1);
        updates[`stats/daily/${day}/revenue`] = increment(-order.total);
      }
      updates['stats/totals/confirmedOrders'] = increment(-1);
      updates['stats/totals/revenue'] = increment(-order.total);
    }
    await update(ref(db), updates);
  });
}

/**
 * "Payment received" (bKash/Nagad TrxID verified): a pending order is auto-confirmed
 * (stock deducted, stats updated) and then marked paid.
 */
function receivePayment(orderId) {
  requireUser();
  return once(`pay:${orderId}`, async () => {
    const o = (await get(ref(db, `orders/${orderId}`))).val();
    if (!o) throw new AppError('NOT_FOUND', 'অর্ডার পাওয়া যায়নি।');
    if (o.status === 'cancelled') throw new AppError('STATE', 'বাতিল অর্ডারে পেমেন্ট নেওয়া যায় না।');
    if (o.status === 'pending') await confirmOrder(orderId);
    await setPaymentStatus(orderId, 'paid');
    return { autoConfirmed: o.status === 'pending' };
  });
}

/**
 * Create or update a product (admin; managers can update within their categories).
 * photos: array of compressed data URIs (max 6) to replace the gallery; undefined = keep.
 * data.thumb should be the small thumbnail of photos[0] (null when no photos).
 */
async function saveProduct(productId, data, { photos } = {}) {
  requireUser();
  const isNew = !productId;
  const id = productId || push(child(ref(db), 'products')).key;
  const p = `products/${id}`;
  const existing = isNew ? null : (await get(ref(db, p))).val();
  if (!isNew && !existing) throw new AppError('NOT_FOUND', 'পণ্য পাওয়া যায়নি।');

  const merged = { ...existing, ...data };
  const active = merged.status === 'active';
  const fields = {
    ...data,
    name: merged.name.trim(),
    nameLower: merged.name.trim().toLowerCase(),
    catPrice: active ? catPriceKey(merged.category, merged.price) : null,
    activeAt: active ? (existing?.activeAt || serverTimestamp()) : null,
    updatedAt: serverTimestamp(),
  };
  const updates = {};
  if (isNew) updates[p] = { stock: 0, ...fields, createdAt: serverTimestamp() };
  else for (const [k, v] of Object.entries(fields)) updates[`${p}/${k}`] = v;
  if (photos !== undefined) {
    if (photos.length > 6) throw new AppError('INVALID', 'সর্বোচ্চ ৬টি ছবি দেওয়া যায়।');
    updates[`productImages/${id}`] = photos.length ? Object.fromEntries(photos.map((d, i) => [`img${i}`, d])) : null;
  }
  // Price changed while the product is in a campaign → re-derive its campaign prices in the same write.
  // Needs CMS permission to read campaigns; without it the old promo stays (it can never exceed the new price at checkout).
  if (!isNew && data.price !== undefined && data.price !== existing.price && existing.promos) {
    try { Object.assign(updates, await recomputeProductPromos(id, data.price, existing.promos)); }
    catch (e) { console.warn('[saveProduct] promo recompute skipped', e?.message || e); }
  }
  Object.assign(updates, auditEntry(isNew ? 'product.create' : 'product.update', p, Object.keys(data).join(',') + (photos ? ` photos=${photos.length}` : '')));
  try { await update(ref(db), updates); } catch (e) {
    if (isPermissionDenied(e) && photos?.length) throw new AppError('REJECTED', 'সংরক্ষণ হয়নি — ছবি খুব বড় হতে পারে, অথবা এই পণ্য এডিটের অনুমতি নেই।', e);
    throw e;
  }
  return id;
}

/** Restock / correct stock with a reason in the audit log. delta can be negative. */
async function adjustStock(productId, delta, reason) {
  const p = `products/${productId}/stock`;
  const res = await runTransaction(ref(db, p), (cur) => {
    if (cur === null) return cur;
    const next = cur + Math.floor(delta);
    return next >= 0 ? next : undefined;
  });
  if (!res.committed) throw new AppError('INVALID', 'স্টক শূন্যের নিচে নামানো যাবে না।');
  await update(ref(db), auditEntry('stock.adjust', p, `${delta > 0 ? '+' : ''}${delta} ${reason || ''}`));
}

  return new Promise((resolve) => {

    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    openModal(html`${modalHead(title)}<div class="stack">${body}</div>

/** { price, was, pct, promo } — what the shopper pays now and what to show struck through. */
function priceView(p, now = serverNow()) {
  const promo = activePromo(p, now);
  const price = promo ? promo.price : p.price;
  const was = promo ? Math.max(p.price, p.compareAtPrice || 0) : (p.compareAtPrice > p.price ? p.compareAtPrice : 0);
  return { price, was, pct: was > price ? Math.round((1 - price / was) * 100) : 0, promo };
}

    return;
  }
  setHTML(appEl, html`<div class="empty"><h2>পাতাটি পাওয়া যায়নি</h2><a class="btn" href="#/">হোমে যান</a></div>`);

// ---------------------------------------------------------------- countdown (server time)
let cdTimer = null;
const countdown = (endAt, label = 'শেষ হবে') => html`<span class="cd" data-cd="${endAt}" role="timer" aria-label="${label}: ${dt(endAt)}"><span class="cd-l">${label}</span></span>`;
function tickCountdowns() {
  const els = $$('[data-cd]');
  if (!els.length) { clearInterval(cdTimer); cdTimer = null; return; }
  const now = serverNow();
  for (const el of els) {
    let left = Math.max(0, Math.floor((Number(el.dataset.cd) - now) / 1000));
    if (!left) { setHTML(el, html`<span class="cd-l">অফার শেষ হয়েছে</span>`); el.removeAttribute('data-cd'); continue; }
    const d = Math.floor(left / 86400); left %= 86400;
    const parts = [d ? `${d}দিন` : null, String(Math.floor(left / 3600)).padStart(2, '0'), String(Math.floor((left % 3600) / 60)).padStart(2, '0'), String(left % 60).padStart(2, '0')].filter(Boolean);
    const label = el.querySelector('.cd-l')?.textContent || '';
    setHTML(el, html`<span class="cd-l">${label}</span>${parts.map((x) => html`<b>${x}</b>`)}`);
  }
}
function startCountdowns() { tickCountdowns(); if (!cdTimer && $('[data-cd]')) cdTimer = setInterval(tickCountdowns, 1000); }

/** Run fn(el) once the element is near the viewport (images are fetched only when about to be seen). */
function whenVisible(el, fn) {
  if (!('IntersectionObserver' in window)) { fn(el); return; }
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) { io.disconnect(); fn(el); }
  }, { rootMargin: '300px' });
  io.observe(el);
  cleanups.push(() => io.disconnect());
}
const isPhone = () => matchMedia('(max-width:720px)').matches;
function putImage(box, src, alt, pos = 'center') {
  if (!src || !box.isConnected || box.querySelector(':scope > img')) return;
  const img = new Image();
  img.alt = alt || ''; img.decoding = 'async'; img.src = src; img.style.objectPosition = BG_POS.includes(pos) ? pos : 'center';
  box.prepend(img);
}

/**
 * Wires a rendered slider. Only the visible slide and the next one fetch their image;
 * phones fetch the mobile image when one exists. Returns a destroy function.
 * opts.variant forces 'desktop' | 'mobile' (admin preview); banner._img = local data URIs (unsaved preview).
 */
function mountSlider(root, banners, cfg = {}, opts = {}) {
  const n = banners.length;
  const slidesEl = $('.slides', root), slides = $$('.slide', root), dots = $$('.sl-dot', root), pauseBtn = $('[data-sl=pause]', root);
  const fade = cfg.transition === 'fade';
  root.classList.toggle('fade', fade);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0, timer = null, hover = false, userPaused = false;
  const load = (k) => {
    const b = banners[k], box = slides[k];
    if (!b || !box || box.dataset.loaded) return;
    box.dataset.loaded = '1';
    const wantMobile = (opts.variant || (isPhone() ? 'mobile' : 'desktop')) === 'mobile';
    const v = wantMobile && (b._img ? b._img.mobile : b.hasMobile) ? 'mobile' : 'desktop';
    const src = b._img ? Promise.resolve(b._img[v] || b._img.desktop || '') : getCmsImage(`bannerImages/${b.id}/${v}`, b.updatedAt);
    src.then((u) => putImage(box, u, b.alt || b.title, b.bgPos));
  };
  const show = (k) => {
    i = (k + n) % n;
    if (fade) slides.forEach((s, j) => s.classList.toggle('on', j === i));
    else slidesEl.style.transform = `translateX(-${i * 100}%)`;
    slides.forEach((s, j) => { s.inert = j !== i; s.setAttribute('aria-hidden', String(j !== i)); });
    dots.forEach((d, j) => { d.classList.toggle('on', j === i); d.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    load(i); if (n > 1) load((i + 1) % n);
  };
  const stop = () => { clearInterval(timer); timer = null; };
  const play = () => {
    stop();
    if (n > 1 && cfg.autoplay !== false && !hover && !userPaused && !reduceMotion && !document.hidden) timer = setInterval(() => show(i + 1), cfg.intervalMs || 5000);
  };
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-sl]'); if (!b) return;
    const a = b.dataset.sl;
    if (a === 'prev') show(i - 1); else if (a === 'next') show(i + 1);
    else if (a === 'pause') {
      userPaused = !userPaused;
      b.setAttribute('aria-pressed', String(userPaused)); b.textContent = userPaused ? '▶ চালান' : '⏸ থামান';
    } else show(Number(a));
    play();
  });
  root.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { show(i - 1); play(); } else if (e.key === 'ArrowRight') { show(i + 1); play(); }
  });
  root.addEventListener('mouseenter', () => { hover = true; stop(); });
  root.addEventListener('mouseleave', () => { hover = false; play(); });
  root.addEventListener('focusin', () => { hover = true; stop(); });
  root.addEventListener('focusout', (e) => { if (!root.contains(e.relatedTarget)) { hover = false; play(); } });
  let x0 = null, y0 = 0;
  root.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') { x0 = e.clientX; y0 = e.clientY; } });
  root.addEventListener('pointerup', (e) => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { show(dx < 0 ? i + 1 : i - 1); play(); }
  });
  root.addEventListener('pointercancel', () => { x0 = null; });
  const onVis = () => play();
  document.addEventListener('visibilitychange', onVis);
  show(0); play();
  return () => { stop(); document.removeEventListener('visibilitychange', onVis); };
}

/** Ordered tracking steps. Prepaid orders show payment early; COD shows it at the end. */
function orderSteps(o) {
  const sm = o.staffMeta || {};
  const prepaid = o.paymentMethod !== 'cod';
  const after = (...st) => st.includes(o.status);
  const placed = { title: 'অর্ডার গ্রহণ করা হয়েছে', at: o.createdAt, done: true };
  const paid = {
    title: prepaid ? 'পেমেন্ট গৃহীত' : 'টাকা পরিশোধ', at: sm.paidAt, done: o.paymentStatus === 'paid',
    desc: prepaid ? `${PM[o.paymentMethod]}${o.paymentRef ? ` · TrxID ${o.paymentRef}` : ''}` : 'ডেলিভারির সময় ক্যাশে',
    showDesc: true,
    bad: o.paymentStatus === 'failed' ? 'পেমেন্ট যাচাই হয়নি — আমাদের সাথে যোগাযোগ করুন' : o.paymentStatus === 'refunded' ? 'টাকা ফেরত দেওয়া হয়েছে' : '',
  };
  const confirmed = { title: 'অর্ডার নিশ্চিত', at: sm.confirmedAt, done: after('confirmed', 'shipped', 'delivered'), desc: 'পণ্য প্যাক করা হচ্ছে' };
  const shipped = { title: 'কুরিয়ারে পাঠানো হয়েছে', at: sm.shippedAt, done: after('shipped', 'delivered'), tracking: o.tracking };
  const delivered = { title: 'ডেলিভারি সম্পন্ন', at: sm.deliveredAt, done: o.status === 'delivered' };
  return prepaid ? [placed, paid, confirmed, shipped, delivered] : [placed, confirmed, shipped, delivered, paid];
}
function orderTimeline(o) {
  const steps = orderSteps(o);
  const cancelled = o.status === 'cancelled';
  const cur = cancelled ? -1 : steps.findIndex((s) => !s.done);
  return html`${cancelled ? html`<div class="alert alert-bad" style="margin-bottom:12px"><strong>অর্ডারটি বাতিল হয়েছে</strong>${o.staffMeta?.cancelledAt ? html` · ${dt(o.staffMeta.cancelledAt)}` : ''}</div>` : ''}
    <ol class="tl ${cancelled ? 'tl-x' : ''}">${steps.map((s, i) => html`
      <li class="${s.done ? 'done' : ''} ${i === cur ? 'cur' : ''} ${s.bad ? 'bad' : ''}">
        <div class="tl-dot" aria-hidden="true">${s.done ? '✓' : i + 1}</div>
        <div class="tl-body"><div class="tl-t">${s.title}${i === cur ? html` <span class="badge b-warn">চলছে</span>` : ''}</div>
          ${s.at ? html`<div class="small muted">${dt(s.at)}</div>` : ''}
          ${s.desc && (s.done || s.showDesc) ? html`<div class="small">${s.desc}</div>` : ''}
          ${s.tracking ? html`<div class="small">${s.tracking.courier} · ট্র্যাকিং ID: <strong>${s.tracking.trackingId}</strong> <button type="button" class="link small" data-action="copy" data-text="${s.tracking.trackingId}">কপি</button></div>` : ''}
          ${s.bad ? html`<div class="small" style="color:var(--bad)">${s.bad}</div>` : ''}
        </div></li>`)}</ol>`;
}

function lastDays(n) {
  const out = [];
  const now = serverNow();
  for (let i = n - 1; i >= 0; i--) out.push(dhakaDay(now - i * 86_400_000));
  return out;
}
function barChart(points) {
  const W = 640, H = 220, L = 52, B = 26, T = 10;
  const max = Math.max(1, ...points.map((p) => p.value));
  const mag = 10 ** Math.floor(Math.log10(max));
  const top = Math.ceil(max / mag) * mag;
  const pw = (W - L) / points.length;
  const bw = Math.max(4, pw - 6);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const short = (v) => (v >= 1e5 ? (v / 1e5).toFixed(1).replace(/\.0$/, '') + 'L' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : String(v));
  const bars = points.map((p, i) => {
    const x = L + i * pw + (pw - bw) / 2, yy = y(p.value), h = H - B - yy;
    const r = Math.min(4, h, bw / 2);
    const d = h <= 0 ? '' : `M${x},${H - B} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${H - B} Z`;
    const label = i % Math.ceil(points.length / 7) === 0 || i === points.length - 1 ? `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(p.day.slice(8))}/${esc(p.day.slice(5, 7))}</text>` : '';
    return `<rect class="hit" x="${L + i * pw}" y="${T}" width="${pw}" height="${H - T - B}" data-i="${i}"></rect><path class="bar" d="${d}"></path>${label}`;
  }).join('');
  const grid = [0, 0.5, 1].map((f) => `<line class="grid-l" x1="${L}" x2="${W}" y1="${y(top * f)}" y2="${y(top * f)}"></line><text x="${L - 8}" y="${y(top * f) + 4}" text-anchor="end">৳${short(top * f)}</text>`).join('');
  return raw(`<div class="chart" id="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="দৈনিক বিক্রি">${grid}${bars}</svg><div class="tip hidden" id="tip"></div></div>`);
}
function wireChart(points) {
  const c = $('#chart'); if (!c) return;
  const tip = $('#tip');
  const show = (e) => {
    const hit = e.target.closest('.hit'); if (!hit) return;
    const p = points[Number(hit.dataset.i)];
    $$('.bar', c).forEach((b, i) => b.classList.toggle('hl', i === Number(hit.dataset.i)));
    tip.textContent = `${p.day} · ${money(p.value)} · ${p.orders} অর্ডার`;
    const box = c.getBoundingClientRect(), hb = hit.getBoundingClientRect();
    tip.classList.remove('hidden');
    const half = tip.offsetWidth / 2;
    const cx = hb.left - box.left + hb.width / 2;
    tip.style.left = `${Math.min(Math.max(cx, half), box.width - half)}px`; // keep inside the card
    tip.style.top = `${Math.max(0, hb.top - box.top + 20)}px`;
  };
  c.addEventListener('pointerover', show);
  c.addEventListener('pointerdown', show);
  c.addEventListener('pointerleave', () => { tip.classList.add('hidden'); $$('.bar', c).forEach((b) => b.classList.remove('hl')); });
}

let formPhotos = [];
let photosChanged = false;
const kb = (dataUrl) => Math.round((dataUrl.length * 3) / 4 / 1024);
function renderPhotos() {
  const g = $('#photoGrid'); if (!g) return;
  setHTML(g, html`${formPhotos.map((src, i) => html`<div class="photo">
    ${i === 0 ? html`<span class="main-tag">মূল</span>` : ''}<img src="${src}" alt="ছবি ${i + 1}">
    <div class="bar"><span class="muted">${kb(src)}KB</span><span>
      ${i > 0 ? html`<button type="button" data-action="photoLeft" data-i="${i}" title="আগে আনুন" aria-label="আগে আনুন">◀</button>` : ''}
      <button type="button" data-action="photoDel" data-i="${i}" title="মুছুন" aria-label="মুছুন">✕</button></span></div></div>`)}
    ${formPhotos.length ? '' : html`<div class="muted small">কোনো ছবি নেই</div>`}`);
}
actions.photoDel = (el) => { formPhotos.splice(Number(el.dataset.i), 1); photosChanged = true; renderPhotos(); };
actions.photoLeft = (el) => {

};

// Size/quality per use. Database rules cap each path at slightly above maxChars.
const IMG_PROFILE = {
  product: { maxDim: 1000, maxChars: 190_000 },
  thumb: { maxDim: 320, maxChars: 38_000 },
  bannerDesktop: { maxDim: 1600, maxChars: 300_000, minWidth: 800 },
  bannerMobile: { maxDim: 900, maxChars: 170_000, minWidth: 400 },
  campaign: { maxDim: 1400, maxChars: 240_000, minWidth: 600 },
  logo: { maxDim: 256, maxChars: 40_000 },
};
const MAX_UPLOAD_BYTES = 20 * 1024 * 1024;
const MAX_PIXELS = 50_000_000; // refuse decompression bombs (e.g. 10000×10000 PNG)

/**
 * Checks the file's first bytes (not its name or reported type): JPEG, PNG, GIF, WebP or AVIF only.
 * SVG, HTML and anything else are rejected, so no script-bearing file ever reaches the canvas or the database.
 */
async function assertImageFile(file) {
  if (!(file instanceof Blob)) throw new AppError('INVALID', 'ছবি ফাইল দিন।');
  if (file.size > MAX_UPLOAD_BYTES) throw new AppError('INVALID', 'ছবিটি ২০MB-এর বেশি বড়।');
  if (file.size < 32) throw new AppError('INVALID', 'ছবি ফাইলটি ভাঙা বা খালি।');
  const b = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  const ascii = (from, to) => String.fromCharCode(...b.slice(from, to));
  const ok = (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) // JPEG
    || (b[0] === 0x89 && ascii(1, 4) === 'PNG') // PNG
    || ascii(0, 4) === 'GIF8' // GIF
    || (ascii(0, 4) === 'RIFF' && ascii(8, 12) === 'WEBP') // WebP
    || (ascii(4, 8) === 'ftyp' && /^(avif|avis)$/.test(ascii(8, 12))); // AVIF
  if (!ok) throw new AppError('INVALID', 'শুধু JPG, PNG, WebP, GIF বা AVIF ছবি দেওয়া যাবে (SVG/অন্য ফাইল নয়)।');
}

/**
 * Validate → decode → resize → re-encode (WebP, JPEG fallback) until the data URI fits maxChars.
 * Re-encoding through a canvas also strips EXIF/GPS metadata and anything appended to the file.
 * Returns { dataUrl, w, h, format, bytes } (metadata kept for a later move to Cloudinary).
 */
async function encodeImage(src, { maxDim, maxChars, minWidth = 0 }) {
  const isFile = src instanceof Blob;
  if (isFile) await assertImageFile(src);
  else if (!isSafeDataImage(src)) throw new AppError('INVALID', 'ছবিটি সঠিক নয়।');
  const url = isFile ? URL.createObjectURL(src) : src;
  try {
    const img = new Image();
    img.src = url;
    try { await img.decode(); } catch { throw new AppError('INVALID', 'ছবিটি খোলা যায়নি — ফাইলটি ভাঙা হতে পারে। অন্য ছবি (JPG/PNG) চেষ্টা করুন।'); }
    const nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh || nw * nh > MAX_PIXELS) throw new AppError('INVALID', 'ছবির মাপ সঠিক নয় বা অনেক বেশি বড় (সর্বোচ্চ ৫০ মেগাপিক্সেল)।');
    if (minWidth && nw < minWidth) throw new AppError('INVALID', `ছবিটি কমপক্ষে ${minWidth}px চওড়া হতে হবে (এটি ${nw}px)।`);
    let dim = maxDim;
    for (let attempt = 0; attempt < 6; attempt++) {
      const scale = Math.min(1, dim / Math.max(nw, nh));
      const w = Math.max(1, Math.round(nw * scale)), h = Math.max(1, Math.round(nh * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); // transparent PNG → white, not black
      g.drawImage(img, 0, 0, w, h);
      for (const q of [0.82, 0.7, 0.58]) {
        let out = c.toDataURL('image/webp', q);
        if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', q); // Safari without WebP encoder
        if (out.length <= maxChars) {
          return { dataUrl: out, w, h, format: out.startsWith('data:image/webp') ? 'webp' : 'jpeg', bytes: Math.round(((out.length - out.indexOf(',') - 1) * 3) / 4) };
        }
      }
      dim = Math.round(dim * 0.75);
    }
    throw new AppError('INVALID', 'ছবিটি যথেষ্ট ছোট করা যায়নি।');
  } finally { if (isFile) URL.revokeObjectURL(url); }
}
const compressImage = async (src, maxDim, maxChars) => (await encodeImage(src, { maxDim, maxChars })).dataUrl;

      const r = await encodeImage(file, profile);

      const cur = bannerDraft.images[key] || bannerDraft.stored[key];
      setHTML($(prevId), cur ? html`<img src="${cur}" alt="">` : html`<span class="muted small">ছবি নেই</span>`);
