  });
  pick('#bnDeskIn', '#bnDeskPrev', IMG_PROFILE.bannerDesktop, 'desktop');
  pick('#bnMobIn', '#bnMobPrev', IMG_PROFILE.bannerMobile, 'mobile');
  let t = null;
  f.addEventListener('input', () => { clearTimeout(t); t = setTimeout(renderBannerPreview, 250); });
  f.addEventListener('change', () => renderBannerPreview());
  renderBannerPreview();
}
let pvView = 'desktop';
let pvDestroy = null;
function renderBannerPreview() {
  const f = $('form[data-form=banner]'), frame = $('#pvFrame');
  if (!f || !frame || !bannerDraft) return;
  const d = formData(f);
  const img = {
    desktop: bannerDraft.images.desktop || bannerDraft.stored.desktop || '',
    mobile: bannerDraft.images.mobile === null ? '' : (bannerDraft.images.mobile || bannerDraft.stored.mobile || ''),
  };
  const b = { id: 'preview', title: d.title || 'শিরোনাম', subtitle: d.subtitle, description: d.description, type: d.type, buttonText: d.buttonText, buttonLink: safeLink(d.buttonLink) || (d.buttonText ? '#/' : ''), bgPos: d.bgPos, showText: !!d.showText, alt: d.alt, _img: img };
  if (pvDestroy) pvDestroy();
  frame.className = `pv-frame ${pvView}`;
  if (d.slot === 'grid') {
    setHTML(frame, html`<div class="pbanner" style="max-width:${pvView === 'mobile' ? '100%' : '420px'}">${bannerInner(b)}</div>`);
    const v = pvView === 'mobile' && img.mobile ? img.mobile : img.desktop;
    putImage($('.pbanner', frame), v, b.alt || b.title, b.bgPos);
    pvDestroy = null;
  } else {
    setHTML(frame, sliderHtml([b], 'pvSlider'));
    pvDestroy = mountSlider($('#pvSlider', frame), [b], { autoplay: false }, { variant: pvView === 'mobile' ? 'mobile' : 'desktop' });
  }
  // Links inside the preview must not navigate away from the unsaved form.
  for (const a of $$('a', frame)) { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); a.tabIndex = -1; }
}
actions.pvView = (el) => {
  pvView = el.dataset.v;
  $$('[data-action=pvView]').forEach((b) => { const on = b === el; b.classList.toggle('btn-primary', on); b.setAttribute('aria-selected', String(on)); });
  renderBannerPreview();
};
actions.bannerMobileRemove = async (el) => {
  const ok = await confirmDialog({ title: 'মোবাইল ছবি সরাবেন?', body: html`<p>সেভ করলে মোবাইল ছবি database থেকে মুছে যাবে, মোবাইলে ডেস্কটপ ছবি দেখাবে।</p>`, confirmText: 'সরান', danger: true });

  bannerDraft.images.mobile = bannerDraft.stored.mobile || bannerDraft.old?.hasMobile ? null : undefined;
  delete bannerDraft.media.mobile;
  setHTML($('#bnMobPrev'), html`<span class="muted small">সেভ করলে সরে যাবে</span>`);

forms.banner = async (f) => {
  const d = formData(f);
  const errs = [];
  const title = d.title.trim(), link = d.buttonLink.trim();
  if (title.length < 2) errs.push('শিরোনাম দিন (কমপক্ষে ২ অক্ষর)');
  if (link && !safeLink(link)) errs.push('বাটনের লিংক সঠিক নয় — https://…, #/… বা tel:… দিন');
  if (d.buttonText.trim() && !link) errs.push('বাটনের লেখা দিলে লিংকও দিন');
  if (d.showText !== 'on' && !link) errs.push('লেখা লুকালে পুরো ব্যানারটি লিংক হয় — একটি লিংক দিন');
  const startAt = d.startAt ? fromLocalInput(d.startAt) : 0, endAt = d.endAt ? fromLocalInput(d.endAt) : FAR_FUTURE;
  if (Number.isNaN(startAt) || Number.isNaN(endAt)) errs.push('তারিখ সঠিক নয়');
  else if (endAt <= startAt) errs.push('শেষের সময় শুরুর পরে হতে হবে');
  if (!bannerDraft.images.desktop && !bannerDraft.stored.desktop) errs.push('ডেস্কটপ ছবি দিন');
  if (errs.length) return toast(errs.join('\n'), 'bad');
  const meta = {
    title, subtitle: d.subtitle.trim() || null, description: d.description.trim() || null,
    type: BANNER_TYPES[d.type] ? d.type : 'custom', slot: d.slot === 'grid' ? 'grid' : 'hero',
    buttonText: d.buttonText.trim() || null, buttonLink: link ? safeLink(link) : null,
    bgPos: BG_POS.includes(d.bgPos) ? d.bgPos : 'center', order: Math.max(0, Math.min(999, Math.trunc(num(d.order)) || 0)),
    alt: d.alt.trim() || null, showText: !!d.showText, enabled: !!d.enabled, startAt, endAt,
    media: Object.keys(bannerDraft.media).length ? bannerDraft.media : undefined,
  };
  if (meta.media === undefined) delete meta.media;
  const images = {};
  if (bannerDraft.images.desktop) images.desktop = bannerDraft.images.desktop;
  if (bannerDraft.images.mobile !== undefined) images.mobile = bannerDraft.images.mobile;
  const ok = await cmsSave($('#bnSave'), () => saveBanner(bannerDraft.id, meta, images), 'ব্যানার সংরক্ষণ হয়েছে');
  if (ok) { bannerDraft = null; go('#/admin/site/banners'); }
};

forms.campaign = async (f) => {
  const d = formData(f);
  const errs = [];
  const title = d.title.trim(), link = d.ctaLink.trim();
  const discountType = DISCOUNT_TYPES[d.discountType] ? d.discountType : 'percentage';
  const discountValue = discountType === 'specialPrice' ? 0 : Math.trunc(num(d.discountValue));
  const startAt = fromLocalInput(d.startAt), endAt = fromLocalInput(d.endAt);
  const priority = Math.trunc(num(d.priority));
  if (title.length < 2) errs.push('শিরোনাম দিন');
  if (discountType === 'percentage' && !(discountValue >= 1 && discountValue <= 90)) errs.push('ছাড় ১% থেকে ৯০% এর মধ্যে দিন');
  if (discountType === 'fixed' && !(discountValue >= 1 && discountValue <= 10_000_000)) errs.push('ছাড়ের টাকা সঠিক নয়');
  if (Number.isNaN(startAt) || Number.isNaN(endAt)) errs.push('শুরু ও শেষের সময় দিন');
  else if (endAt <= startAt) errs.push('শেষের সময় শুরুর পরে হতে হবে');
  if (!(priority >= 0 && priority <= 100)) errs.push('Priority ০ থেকে ১০০ দিন');
  if (link && !safeLink(link)) errs.push('বাটনের লিংক সঠিক নয়');
  if (!campDraft.products.size) errs.push('অন্তত একটি পণ্য যোগ করুন');
  const products = {};
  for (const [pid, p] of campDraft.products) {
    if (discountType === 'specialPrice') {
      const sp = Math.trunc(num(p.special));
      if (!(sp >= 1 && sp < p.price)) { errs.push(`"${p.name}" — বিশেষ দাম ${money(p.price)}-এর কম দিন`); continue; }
      products[pid] = sp;
    } else products[pid] = true;
  }
  if (errs.length) return toast(errs.slice(0, 6).join('\n'), 'bad');
  const c = {
    title, subtitle: d.subtitle.trim() || null, description: d.description.trim() || null,
    kind: CAMPAIGN_KINDS[d.kind] ? d.kind : 'special', discountType, discountValue,
    startAt, endAt, priority, order: Math.max(0, Math.min(999, Math.trunc(num(d.order)) || 0)),
    enabled: !!d.enabled, ctaText: d.ctaText.trim() || null, ctaLink: link ? safeLink(link) : null, products,
  };
  let result = null;
  const ok = await cmsSave($('#cpSave'), async () => { result = await saveCampaign(campDraft.id, c, { image: campDraft.image }); });
  if (!ok) return;
  toast(`ক্যাম্পেইন সংরক্ষণ হয়েছে · ${result.applied}টি পণ্যে অফার দাম বসেছে${result.skipped.length ? `\n${result.skipped.length}টি পণ্যে দাম কমছে না, তাই বসেনি` : ''}`, 'ok');
  pcache.clear();
  campDraft = null;
  go('#/admin/site/campaigns');
};

  if (role) await setStaffRole(f.dataset.id, role, role === 'manager' ? cats : [], { cms });
  else await removeStaffRole(f.dataset.id);
  toast('রোল আপডেট হয়েছে', 'ok'); refresh(seq);
};

// ---------------------------------------------------------------- audit
async function admAudit(box, ctx) {
  setHTML(box, html`<h1>অডিট লগ</h1><p class="muted small">কে, কখন, কী করেছেন — এই তালিকা কেউ মুছতে বা বদলাতে পারে না।</p>
    <div class="tw"><table class="t"><thead><tr><th>সময়</th><th>কে</th><th>কাজ</th><th>কোথায়</th><th>বিস্তারিত</th></tr></thead><tbody id="arows"></tbody></table></div><div id="amore" class="pager"></div>`);
  let cursor = null;
  const load = async () => {
    const more = $('#amore');
    setHTML(more, loadingBlock());
    try {
      const r = await getAuditLogs({ pageSize: 50, cursor });
      if (!ctx.alive()) return;
      cursor = r.cursor;
      $('#arows').insertAdjacentHTML('beforeend', r.items.map((l) => html`<tr><td class="small nowrap">${dt(l.at)}</td>
        <td><code class="id">${l.uid === S.user.uid ? 'আপনি' : shortId(l.uid)}</code></td><td>${l.action}</td>
        <td class="small">${l.target}</td><td class="small muted">${l.details || ''}</td></tr>`.s).join(''));
      if (!$('#arows').children.length) setHTML(more, html`<div class="empty">এখনও কোনো লগ নেই।</div>`);
      else setHTML(more, cursor ? html`<button class="btn" data-action="moreAudit">আরও লোড করুন</button>` : '');
    } catch (e) { if (ctx.alive()) setHTML(more, errorBlock(e)); }
  };
  actions.moreAudit = load;
  await load();
}


// ---------------------------------------------------------------- boot
/** Re-read public settings + CMS content (after an admin save, or on boot). */
async function reloadPublic({ force = false } = {}) {
  const settings = await getSettings();
  S.settings = settings;
  rememberSettings(settings);
  S.content = await loadPublicContent(settings, { force });
  renderHeader();
}

(async function boot() {
  // First paint from the last visit's public settings (contact info, announcement), then refresh.
  const cached = cachedSettings();
  if (cached) S.settings = cached;
  $('#ftrYear').textContent = String(new Date().getFullYear());
  renderHeader();
  try {
    const [, cats] = await Promise.all([
      reloadPublic().catch((e) => console.error('[boot settings]', e)),
      getCategories().catch(() => []),
    ]);
    S.categories = cats;
  } catch (e) { console.error(e); }
  renderHeader();
  let first = true;
  onUserChanged(async (u) => {
    S.user = u;
    await refreshSession();
    if (first) { first = false; resolveAuthReady(); route(); }
    else if (/^#\/(admin|account|checkout|order)/.test(location.hash) && !u) route();
  });
})();

</script>
